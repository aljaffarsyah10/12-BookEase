  <text x="75" y="315" fill="#10B981" font-family="monospace" font-size="12">{"timestamp":"2026-11-10T15:00:12.102Z","level":"INFO","message":"[HTTP_REQUEST] GET /api/health","durationMs":8.4,"context":{"ip":"127.0.0.1","userAgent":"BookEase-HealthCheck"}}</text>
  <text x="75" y="345" fill="#60A5FA" font-family="monospace" font-size="12">{"timestamp":"2026-11-10T15:00:15.821Z","level":"INFO","message":"[BOOKING_CREATED] Reference: BK-20261110-8A19F","context":{"businessId":"biz_9x12","serviceId":"srv_hair","staffId":"stf_budi"}}</text>
  <text x="75" y="375" fill="#FBBF24" font-family="monospace" font-size="12">{"timestamp":"2026-11-10T15:00:18.412Z","level":"DEBUG","message":"[CACHE_HIT] services:biz_9x12:true","durationMs":0.4}</text>
  <text x="75" y="405" fill="#E2E8F0" font-family="monospace" font-size="12">{"timestamp":"2026-11-10T15:00:22.980Z","level":"INFO","message":"[BILLING_CHECKOUT] Created INV-20261110-3FA1 for plan PRO","context":{"amount":199000,"paymentMethod":"QRIS"}}</text>
  <text x="75" y="435" fill="#A78BFA" font-family="monospace" font-size="12">{"timestamp":"2026-11-10T15:00:25.109Z","level":"INFO","message":"[PII_PROTECTION] User login attempt payload sanitized","context":{"user":"budi","password":"[REDACTED]"}}</text>
  <text x="75" y="465" fill="#10B981" font-family="monospace" font-size="12">{"timestamp":"2026-11-10T15:00:30.000Z","level":"INFO","message":"[BACKUP_CRON] Daily snapshot created with SHA-256 integrity checksum","context":{"filesizeKb":11.03}}</text>
  
  <rect x="75" y="500" width="220" height="38" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="95" y="524" fill="#38BDF8" font-family="monospace" font-size="12">GET /api/health/ready</text>
