  <rect x="555" y="500" width="280" height="38" rx="8" fill="#1F2937" stroke="#374151" stroke-width="1"/>
  <text x="575" y="524" fill="#38BDF8" font-family="monospace" font-size="12">npm run test:smoke</text>
