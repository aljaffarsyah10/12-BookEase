  <text x="355" y="205" fill="#64748B" font-family="system-ui, -apple-system, sans-serif" font-size="11">Optimal GC &amp; Memory Allocation</text>

  <!-- Error Rate -->
  <rect x="610" y="96" width="260" height="130" rx="12" fill="#1E293B" stroke="#334155" stroke-width="1"/>
